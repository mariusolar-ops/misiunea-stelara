# Publică jocul pe GitHub Pages la fiecare push pe ramura main.
name: Publică jocul

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v5

      - name: Instalează Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalează pachetele
        run: npm ci

      - name: Construiește jocul
        run: npm run build

      - name: Configurează Pages
        uses: actions/configure-pages@v5

      - name: Încarcă jocul
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publică pe GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
