<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Mihai: Misiunea Stelară</title>
  </head>
  <body>
    <!-- Aici desenează Three.js jocul -->
    <canvas id="scena"></canvas>

    <!-- Interfața de deasupra jocului (butoane, joystick, texte) -->
    <div id="interfata">
      <div id="joystick"><div id="joystick-buton"></div></div>
      <button id="buton-sari" aria-label="Sari">SARI</button>
      <!-- Sus: monede și cronometru -->
      <div id="hud">
        <div id="hud-monede"><span class="moneda-mica"></span><span id="nr-monede">0/0</span></div>
        <div id="hud-timp">0:00</div>
      </div>
      <div id="mesaj"></div>
      <div id="fps"></div>
    </div>

    <!-- Ecran de start: primul tap pornește ecranul complet -->
    <div id="ecran-start">
      <h1>Mihai:<br /><span>Misiunea Stelară</span></h1>
      <button id="buton-start">ÎNCEPE</button>
      <p class="mic">Nivelul 1 – Baza de pe Lună</p>
    </div>

    <!-- Ecranul de final al nivelului -->
    <div id="ecran-final">
      <div class="cutie">
        <h2>Felicitări, Mihai!</h2>
        <p id="final-nivel"></p>
        <div id="final-stele"></div>
        <div class="rand-rezultate">
          <div><span class="eticheta">Timp</span><span id="final-timp"></span></div>
          <div><span class="eticheta">Monede</span><span id="final-monede"></span></div>
        </div>
        <button id="buton-din-nou" class="mare">Joacă din nou</button>
      </div>
    </div>

    <!-- Apare când telefonul e ținut vertical -->
    <div id="roteste">
      <div class="telefon"></div>
      <p>Întoarce telefonul pe orizontală</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
