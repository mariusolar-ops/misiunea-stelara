<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Un joc de sărituri prin spațiu, făcut pentru Mihai." />
    <title>Mihai: Misiunea Stelară</title>
    <!-- Aplicație instalabilă (PWA): manifest + iconițe desenate din cod -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/iconite/icon-32.png" />
    <link rel="apple-touch-icon" href="/iconite/icon-180.png" />
  </head>
  <body>
    <!-- Aici desenează Three.js jocul -->
    <canvas id="scena"></canvas>

    <!-- Interfața din timpul jocului -->
    <div id="interfata" class="ascuns">
      <button id="buton-pauza" aria-label="Pauză" data-t-aria="Pauză"><span></span><span></span></button>
      <button id="buton-sunet" class="buton-sunet" aria-label="Sunet" data-t-aria="Sunet">🔊</button>
      <button id="buton-zoom" class="buton-sunet" aria-label="Zoom">🔍</button>
      <div id="hud">
        <div id="hud-monede"><span class="moneda-mica"></span><span id="nr-monede">0/0</span></div>
        <div id="hud-timp">0:00</div>
        <div id="hud-x2" class="ascuns">🔥 x2</div>
      </div>
      <div id="joystick"><div id="joystick-buton"></div></div>
      <button id="buton-sari" aria-label="Sari" data-t="SARI">SARI</button>
      <button id="buton-teleport" class="ascuns" aria-label="Teleport">🌀</button>
      <!-- bara de energie pentru zbor (apare doar dacă puterea Zbor e pornită) -->
      <div id="energie" class="ascuns"><div id="energie-plin"></div></div>
      <div id="mesaj"></div>
      <div id="fps"></div>
    </div>

    <!-- Meniurile (principal, alegere nivel, pauză) – construite din src/ui/Meniu.ts -->
    <div id="meniu"></div>

    <!-- Ecranul de final al nivelului -->
    <div id="ecran-final">
      <div class="cutie">
        <h2 id="final-titlu">Felicitări, Mihai!</h2>
        <p id="final-nivel"></p>
        <p id="final-mesaj"></p>
        <div id="final-stele"></div>
        <div class="rand-rezultate">
          <div><span class="eticheta" data-t="Timp">Timp</span><span id="final-timp"></span></div>
          <div><span class="eticheta" data-t="Monede">Monede</span><span id="final-monede"></span></div>
        </div>
        <p id="final-record"></p>
        <p id="final-castig"></p>
        <div class="rand-butoane">
          <button id="buton-meniu-final" class="mic-buton" data-t="Meniu">Meniu</button>
          <button id="buton-din-nou" class="mic-buton" data-t="Din nou">Din nou</button>
          <button id="buton-urmator" class="mare">Nivelul următor</button>
        </div>
      </div>
    </div>

    <!-- Apare când telefonul e ținut vertical -->
    <div id="roteste">
      <div class="telefon"></div>
      <p data-t="Întoarce telefonul pe orizontală">Întoarce telefonul pe orizontală</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
